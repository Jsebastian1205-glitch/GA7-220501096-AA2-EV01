# Blueprint de Render: despliega la API (backend-api) como servicio web Docker.
# Render > New > Blueprint > seleccionar este repositorio.
services:
  - type: web
    name: buildzone-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend-api/Dockerfile
    dockerContext: ./backend-api
    healthCheckPath: /api/planes
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
