# =====================================================================
# Perfil "prod": despliegue en la nube (Render, contenedor Docker).
#
# Por defecto usa H2 en memoria con el catalogo de ejemplo, porque el plan
# gratuito de Render no ofrece disco persistente: los datos se reinician
# cada vez que el servicio se reinicia o "despierta".
#
# Para usar una base de datos MySQL externa basta con definir en Render:
#   DATABASE_URL=jdbc:mysql://<host>:3306/buildzone?useSSL=true
#   DB_USER, DB_PASSWORD, DB_DRIVER=com.mysql.cj.jdbc.Driver
#   JPA_DDL_AUTO=none   (y ejecutar antes los scripts de database/mysql)
# =====================================================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:buildzone;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=false

# La consola H2 nunca se expone en produccion.
spring.h2.console.enabled=false

# Render termina HTTPS en su proxy y reenvia la peticion por HTTP.
server.forward-headers-strategy=framework

logging.level.root=INFO
logging.level.com.buildzone=INFO
