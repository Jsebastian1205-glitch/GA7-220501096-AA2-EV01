spring.application.name=buildzone-api

# Puerto distinto al de auth-service (8081) para poder correr ambos servicios
# al mismo tiempo sin que choquen.
server.port=8082

# Conexion a la MISMA base de datos que ya usa el modulo JDBC de backend-java
# (Proyecto Sena 1). Las tablas producto, marca y categoria ya existen, por
# eso NO se usa createDatabaseIfNotExist ni se deja que Hibernate las cree.
spring.datasource.url=jdbc:mysql://localhost:3306/buildzone?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=none: Hibernate NUNCA debe modificar ni validar de forma estricta
# el esquema. Las tablas producto/marca/categoria ya existen en produccion
# con su propia estructura (verificada en phpMyAdmin); esta API solo lee y
# escribe datos, no gestiona el esquema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Evita que Hibernate mantenga la sesion abierta durante el renderizado de
# la vista (no aplica aqui porque es una API REST pura, pero es buena
# practica desactivarlo explicitamente).
spring.jpa.open-in-view=false
