# =====================================================================
# BuildZone API - configuracion comun a todos los ambientes
# ---------------------------------------------------------------------
# Perfil por defecto: MySQL/MariaDB de XAMPP (base de datos "buildzone").
# Perfil "dev": H2 en memoria con datos de ejemplo (no requiere XAMPP).
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Ver README.md, seccion "Ambientes".
# =====================================================================
spring.application.name=buildzone-api

# Puerto que espera el front-end (api.js -> http://localhost:8080/api).
server.port=8080

# ---------------------------------------------------------------------
# Base de datos (perfil por defecto: MySQL/MariaDB - XAMPP)
# Las tablas producto, marca y categoria ya existen. Las tablas nuevas
# (usuario_cuenta, plan_suscripcion, suscripcion) se crean UNA vez con
# el script database/mysql/01_usuarios_suscripciones.sql
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/buildzone?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=none: Hibernate NUNCA modifica el esquema de la base real;
# el esquema se gestiona con los scripts SQL versionados en Git.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Seguridad (JWT)
# La clave es Base64 de al menos 256 bits. En produccion se debe definir
# con la variable de entorno JWT_SECRET y NO dejar este valor de ejemplo.
# ---------------------------------------------------------------------
buildzone.jwt.secret=${JWT_SECRET:V+ClppfJJpplwJCoBw1+E+TWBZw4ONFPwklx1J/omza5hFoT6/D9yO/EiKdHLRvV}
# Vigencia del token: 8 horas (en milisegundos)
buildzone.jwt.expiracion-ms=28800000

# Administrador inicial: se crea al arrancar solo si no existe ningun
# usuario con ese correo. Cambiar la contrasena despues del primer login.
buildzone.admin.email=${ADMIN_EMAIL:admin@buildzone.com}
buildzone.admin.username=admin
buildzone.admin.password=${ADMIN_PASSWORD:Admin1234}

# Origenes permitidos por CORS (front-end abierto con Live Server,
# desde el sistema de archivos, etc.). Separados por coma.
buildzone.cors.origenes-permitidos=*

# Mensajes de error sin trazas internas hacia el cliente
server.error.include-stacktrace=never
