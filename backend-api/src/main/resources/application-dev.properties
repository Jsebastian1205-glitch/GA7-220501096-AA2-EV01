# =====================================================================
# Perfil "dev": ambiente de desarrollo sin XAMPP.
# H2 en memoria en modo compatible con MySQL; Hibernate crea las tablas
# a partir de las entidades y CatalogoDemoInitializer carga datos de
# ejemplo (marcas, categorias y productos). Todo se pierde al detener.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Consola web de H2: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:buildzone   usuario: sa   (sin contrasena)
# =====================================================================
spring.datasource.url=jdbc:h2:mem:buildzone;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
