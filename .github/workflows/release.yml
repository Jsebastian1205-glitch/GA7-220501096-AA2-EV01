# Publica los ejecutables: al crear una etiqueta vX.Y.Z (git tag v1.0.0 &&
# git push origin v1.0.0) compila el JAR, ejecuta las pruebas y crea un
# Release en GitHub con el JAR y el front-end empaquetado.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar JAR (con pruebas)
        working-directory: backend-api
        run: mvn -B package
      - name: Empaquetar front-end
        run: zip -r buildzone-frontend.zip index.html Style.css config.js ui.js api.js auth.js planes.js cuenta.js admin.js catalogo.js script.js
      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend-api/target/buildzone-api-*.jar
            buildzone-frontend.zip
            backend-api/database/mysql/*.sql
          generate_release_notes: true
