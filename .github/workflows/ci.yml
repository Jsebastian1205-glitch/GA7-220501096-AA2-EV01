# Integracion continua: en cada push o pull request ejecuta las pruebas
# unitarias/integracion del backend y las pruebas E2E de la interfaz.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Pruebas backend (JUnit + Mockito + MockMvc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ejecutar pruebas
        run: mvn -B test
      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: backend-api/target/surefire-reports/

  frontend-e2e:
    name: Pruebas E2E de la interfaz (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node e2e_buildzone.mjs
